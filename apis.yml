apis:
- aid: cuscal:cuscal-digital-card-issuance-api
  name: Cuscal Digital Card Issuance API
  description: >-
    Part of Cuscal's CMS REST API family for card issuers. Enables instant
    digital card issuance and provisioning of cards into mobile and digital
    wallets (the 'Pays') for online and in-store transactions, with webhook
    notifications for card lifecycle events. Documented on the Cuscal Developer
    Hub; full reference and any OpenAPI definition are gated behind client
    onboarding.
  humanURL: https://www.cuscal.com/payments/issuing/digital-enablement/
  tags:
  - Card Issuing
  - Digital Wallet
  - Tokenization
  properties:
  - type: Documentation
    url: https://www.cuscal.com/payments/issuing/digital-enablement/
  - type: APIReference
    url: https://www.developerhub.cuscal.com.au/
- aid: cuscal:cuscal-card-controls-api
  name: Cuscal Card Controls API
  description: >-
    CMS REST API letting cardholders and back-office staff control and restrict
    card usage - locking and unlocking cards and blocking certain transaction
    types to reduce fraud. Documented on the Cuscal Developer Hub; full
    reference is gated behind client onboarding.
  humanURL: https://www.cuscal.com/payments/issuing/digital-enablement/
  tags:
  - Card Controls
  - Fraud Prevention
  - Cards
  tags_raw:
  - Card Controls
  - Fraud
  - Cards
  properties:
  - type: Documentation
    url: https://www.cuscal.com/payments/issuing/digital-enablement/
  - type: APIReference
    url: https://www.developerhub.cuscal.com.au/
- aid: cuscal:cuscal-pin-services-api
  name: Cuscal PIN Services API
  description: >-
    CMS REST API providing self-service PIN set and change functionality that
    issuers can embed in mobile payment apps, removing reliance on PIN mailers.
    Documented on the Cuscal Developer Hub; full reference is gated behind
    client onboarding.
  humanURL: https://www.cuscal.com/payments/issuing/digital-enablement/
  tags:
