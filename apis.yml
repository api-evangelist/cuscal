name: Cuscal

kind: company

description: >-
  Cuscal Limited is Australia's largest independent provider of payments and
  regulated data services outside the Big Four banks, founded in 1966 and listed
  on the ASX (ticker CCL). An Authorised Deposit-taking Institution regulated by
  APRA and ASIC, Cuscal supplies the connectivity and processing layer beneath
  hundreds of banks, mutuals, credit unions, fintechs, non-bank lenders and
  corporates - carrying scheme card issuing and acquiring, the New Payments
  Platform (NPP) with PayID and PayTo, Direct Entry, BPAY, RTGS, ATM services,
  AI-driven fraud monitoring, and Consumer Data Right (open banking) data-holder
  and accredited-data-recipient services. Its acquisitions of Indue and the
  Paymark/Strategic Payments Services businesses broadened its issuer-processor
  and acquiring reach. Cuscal's API posture is B2B and relationship-gated: it
  runs a public-facing Developer Hub (ReadMe-hosted) documenting CMS REST APIs
  for card issuing, card controls and PIN services with webhook notifications,
  but the full reference and any machine-readable OpenAPI definitions sit behind
  client onboarding rather than open self-serve signup.

